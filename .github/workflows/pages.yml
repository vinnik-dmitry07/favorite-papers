# Publish the citation map as https://vinnik-dmitry07.github.io/favorite-papers/
name: Deploy citation map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage static map
        run: |
          mkdir -p site/assets/vendor
          sed 's|\.\./assets/|assets/|g' src/index.html > site/index.html
          cp src/map.js site/
          cp assets/graph_data.js site/assets/
          cp assets/vendor/d3.v7.min.js site/assets/vendor/
          touch site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
