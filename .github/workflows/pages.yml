# Publish the citation map as https://vinnik-dmitry07.github.io/favorite-papers/
name: Deploy citation map

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Agent API]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Locate verified API discovery
        id: discovery
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { findApiDiscovery } = require('./.github/scripts/find-api-discovery.cjs');
            const discovery = await findApiDiscovery({ github, ...context.repo });
            if (discovery) {
              core.setOutput('run_id', String(discovery.runId));
            } else {
              core.warning('No unexpired, trusted API discovery artifact; publishing static links only.');
            }
      - name: Download verified discovery
        if: steps.discovery.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-api-discovery
          path: agent_build/discovery
          run-id: ${{ steps.discovery.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Stage static map
        run: |
          python3 src/build_fulltext_search.py
          test -s assets/fulltext_search.js
          mkdir -p site/assets/vendor
          sed 's|\.\./assets/|assets/|g' src/index.html > site/index.html
          cp src/map.js site/
          cp assets/graph_data.js site/assets/
          cp assets/fulltext_search.js site/assets/
          cp assets/vendor/d3.v7.min.js site/assets/vendor/
          touch site/.nojekyll
      - name: Build agent catalog and text pages
        run: python3 src/build_agent_pages.py --out site --discovery agent_build/discovery/smoke.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
