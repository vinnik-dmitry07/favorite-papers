name: Preserve search corpus
'on':
  workflow_dispatch:
  push:
    branches: [main, feat/static-search-probe]
    paths:
      - .github/workflows/preserve-search-corpus.yml
      - src/retained_search_archive.py
permissions:
  contents: write
  actions: read
concurrency:
  group: preserve-retained-search-corpus
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save reviewed bytes and independently download them again
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/retained_search_archive.py --preserve --report archive-reports/preservation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-corpus-preservation-${{ github.run_id }}
          path: archive-reports/
          if-no-files-found: ignore
