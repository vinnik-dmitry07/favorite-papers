        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.probe_credentials == 'repository' && secrets.CLOUDFLARE_ACCOUNT_ID || inputs.probe_credentials == 'probe_environment' && secrets.PROBE_CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.probe_credentials == 'repository' && secrets.CLOUDFLARE_API_TOKEN || inputs.probe_credentials == 'probe_environment' && secrets.PROBE_CLOUDFLARE_API_TOKEN || '' }}
      - name: Run bounded compatibility and real REST MCP journeys
        id: measure
        timeout-minutes: 13
        continue-on-error: true
        env:
          PROBE_ORIGIN: ${{ steps.deploy.outputs.origin }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.probe_credentials == 'repository' && secrets.CLOUDFLARE_ACCOUNT_ID || inputs.probe_credentials == 'probe_environment' && secrets.PROBE_CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.probe_credentials == 'repository' && secrets.CLOUDFLARE_API_TOKEN || inputs.probe_credentials == 'probe_environment' && secrets.PROBE_CLOUDFLARE_API_TOKEN || '' }}
        run: |
          python src/run_real_search_probe.py --origin "$PROBE_ORIGIN" \
            --manifest agent_real_probe/probe.json \
            --expected-manifest-sha "$PROBE_MANIFEST_SHA" \
            --script-name "$PROBE_NAME" --output probe-real-report.json \
            --wait-seconds 120
      - name: Remove the owned DO namespace and Worker
        id: cleanup
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled')
        timeout-minutes: 8
        run: python src/static_search_do_lifecycle.py cleanup "$PROBE_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.probe_credentials == 'repository' && secrets.CLOUDFLARE_ACCOUNT_ID || inputs.probe_credentials == 'probe_environment' && secrets.PROBE_CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.probe_credentials == 'repository' && secrets.CLOUDFLARE_API_TOKEN || inputs.probe_credentials == 'probe_environment' && secrets.PROBE_CLOUDFLARE_API_TOKEN || '' }}
      - name: Remove the temporary real-probe secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/real-probe-secrets.json"
      - name: Preserve real-subset evidence and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-search-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
