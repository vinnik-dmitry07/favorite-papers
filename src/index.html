<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key papers - citation map</title>
<script>
  /* Phone modes, decided before the first paint so nothing flashes.
     compact: the header folds into one menu button and the plot margins
     shrink. rotated: a phone held upright draws the whole page sideways,
     so the map always reads as landscape even with the phone's rotation
     lock on. CSS keys off html.compact / html.rotated; map.js reads the
     same classes. */
  (function () {
    var queries = {
      compact: '(pointer: coarse) and (max-width: 600px), '
        + '(pointer: coarse) and (max-height: 600px)',
      rotated: '(pointer: coarse) and (orientation: portrait) and (max-width: 600px)'
    };
    var root = document.documentElement;
    Object.keys(queries).forEach(function (name) {
      var mq = window.matchMedia(queries[name]);
      root.classList.toggle(name, mq.matches);
      // map.js re-lays out on this; a media flip need not come with a resize.
      function changed() {
        root.classList.toggle(name, mq.matches);
        root.dispatchEvent(new Event('modechange'));
      }
      if (mq.addEventListener) mq.addEventListener('change', changed);
      else mq.addListener(changed);
    });
  }());
</script>

<style>
  :root {
    --bg: #fbfbfa;
    --ink: #1d2529;
    --muted: #74838c;
    --rule: #dfe3e5;
    --node: #2f7d8f;
    --edge: #9aa5ad;
    --in: #c2603f;
    --out: #2f6f9f;
    --sel: #1d2529;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(var(--bg) 70%, rgba(251, 251, 250, 0));
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type=search], select {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--rule); border-radius: 5px; padding: 4px 7px;
  }
  input[type=search] { width: 280px; }
  label.check { color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .qscale {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; letter-spacing: .2px;
  }
  .qscale b {
    display: inline-block; width: 52px; height: 7px; border-radius: 4px;
    background: linear-gradient(90deg, #c62828, #d9d3c5, #2e7d32);
  }
  button {
    font: inherit; background: #fff; color: var(--ink); cursor: pointer;
    border: 1px solid var(--rule); border-radius: 5px; padding: 4px 9px;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { color: var(--muted); cursor: default; }
  button:disabled:hover { border-color: var(--rule); }
  .key { color: var(--muted); display: flex; align-items: center; gap: 12px; }
  .key i { display: inline-block; width: 16px; height: 2px; margin-right: 4px;
           vertical-align: middle; }
  .key .i-in { background: var(--in); }
  .key .i-out { background: var(--out); }
  .legend {
    display: flex; flex-direction: column; gap: 4px; width: 100%;
    color: var(--muted); font-size: 11.5px;
  }
  .legend-row {
    display: flex; flex-wrap: wrap; gap: 5px 11px; align-items: center;
  }
  .legend-label {
    font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); min-width: 42px;
  }
  .legend .fam {
    font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin-left: 8px;
  }
  .legend span { display: flex; align-items: center; gap: 5px; cursor: pointer;
                 user-select: none; }
  .legend span.off { opacity: .38; }
  .legend span.on { color: var(--ink); }
  .legend .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 0;
  }
  .legend .swatch.idea {
    border-radius: 2px; background: transparent !important;
    border: 1.5px solid var(--muted);
  }
  /* d3-zoom only preventDefaults touchmove; touch-action keeps the browser
     from starting its own pinch or scroll over the map on a slow frame. */
  svg { position: absolute; inset: 0; width: 100%; height: 100%;
        touch-action: none; }
  .axis text { fill: var(--muted); font-size: 11px; }
  .axis line, .axis path { stroke: var(--rule); }
  .grid line { stroke: var(--rule); stroke-dasharray: 2 4; }
  .caption { fill: var(--muted); font-size: 10.5px; letter-spacing: 1.1px;
             text-transform: uppercase; }
  .gutter-rule { stroke: var(--rule); stroke-dasharray: 4 4; }
  /* stroke is set per element so hover/search highlighting can override it */
  .edge { fill: none; }
  .node circle { cursor: pointer; }
  .node.dim, .sel.dim { opacity: .12; }
  .rings, .rings * { pointer-events: none; }
  .sel-ring {
    fill: none; stroke: var(--sel); stroke-linecap: round;
  }
  /* font-size and stroke-width are attributes: map.js keeps them at a constant
     on-screen size while the geometry zooms */
  .label { fill: var(--ink); paint-order: stroke;
           stroke: rgba(251,251,250,.95); pointer-events: none; }
  .label.dim { opacity: .1; }
  #tip {
    position: absolute; z-index: 4; max-width: 330px; pointer-events: none;
    background: #fff; border: 1px solid var(--rule); border-radius: 6px;
    padding: 9px 11px; box-shadow: 0 4px 14px rgba(20, 30, 40, .12);
    opacity: 0; transition: opacity .1s;
  }
  #tip b { display: block; font-size: 12.5px; margin-bottom: 3px; }
  #tip .meta { color: var(--muted); font-size: 11.5px; }
  #tip .counts { margin-top: 5px; font-size: 11.5px; }
  #tip .counts span { margin-right: 10px; }
  #tip .in { color: var(--in); }
  #tip .out { color: var(--out); }
  /* The hotspot is the fingertip, so the box stays 0x0 and the hand hangs off it. */
  #ghost {
    position: absolute; left: 0; top: 0; z-index: 5; width: 0; height: 0;
    pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  #ghost.on { opacity: 1; }
  #ghost svg {
    position: absolute; left: -3px; top: -2px; width: 26px; height: 30px;
    overflow: visible; transform-origin: 3px 2px;
    filter: drop-shadow(0 1px 2px rgba(20, 30, 40, .28));
  }
  #ghost.press svg { transform: scale(.86); }
  #ghost .ring {
    position: absolute; border: 2px solid var(--in); border-radius: 50%;
    animation: ghost-ring .9s ease-out forwards;
  }
  @keyframes ghost-ring {
    from { transform: scale(.3); opacity: .9; }
    40% { transform: scale(1); opacity: .75; }
    to { transform: scale(1.6); opacity: 0; }
  }
  @keyframes ghost-blink { from { opacity: .9; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #ghost .ring { animation-name: ghost-blink; }
  }
  footer {
    position: absolute; left: 16px; bottom: 8px; z-index: 3;
    color: var(--muted); font-size: 11px;
  }
  /* Phones (html.compact, set in the head): the header folds into one
     floating button; a tap opens a left drawer with everything else, so the
     map stays visible while filtering. map.js ignores the header height in
     this mode. */
  #menu { display: none; }
  html.compact { --drawer: min(340px, 45%); }
  html.compact #menu {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; flex: none; align-self: flex-start;
    font-size: 17px; line-height: 1; touch-action: manipulation;
  }
  html.compact header { right: auto; padding: 6px; gap: 8px; }
  html.compact header:not(.open) { background: none; }
  html.compact header:not(.open) > :not(#menu) { display: none; }
  html.compact header.open {
    bottom: 0; width: var(--drawer);
    flex-direction: column; flex-wrap: nowrap; align-items: stretch;
    overflow-y: auto; padding: 6px 10px 12px;
    background: var(--bg); box-shadow: 4px 0 18px rgba(20, 30, 40, .14);
  }
  html.compact header.open #menu { position: sticky; top: 0; z-index: 1; }
  html.compact header.open h1 small { display: block; margin-left: 0; }
  html.compact header.open .controls {
    flex-direction: column; align-items: stretch; gap: 8px;
  }
  html.compact header.open input[type=search] { width: 100%; }
  /* iOS Safari zooms the page when a control under 16px takes focus. */
  html.compact input[type=search], html.compact select { font-size: 16px; }
  html.compact header.open .key {
    flex-direction: column; align-items: flex-start; gap: 4px;
  }
  html.compact footer {
    left: 8px; right: 8px; bottom: 4px; font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Keep the hit count readable while typing in the drawer's search box. */
  html.compact header.open ~ footer { left: calc(var(--drawer) + 8px); }
  /* Phone held upright (html.rotated): draw the page sideways. The body is
     the containing block for everything, so header, map, tooltip and hand
     turn with it. Local (x, y) lands at client (bodyHeight - y, x): the page
     top sits on the phone's right edge, upright after a counter-clockwise
     turn. map.js reads pointers through d3.pointer, whose getScreenCTM
     inverse undoes the turn; its other geometry is layout sizes. */
  html.rotated { overflow: hidden; }
  html.rotated body {
    position: fixed; top: 0; left: 0;
    width: 100vh; width: 100dvh;
    height: 100vw;
    transform-origin: 0 0;
    transform: rotate(90deg) translateY(-100%);
  }
</style>
</head>
<body>
<header id="panel">
  <button id="menu" aria-expanded="false" aria-controls="panel"
          aria-label="Filters and legend">&#9776;</button>
  <h1>Key papers citation map
    <small id="stats"></small>
  </h1>
  <div class="controls">
    <input type="search" id="search" placeholder="title, author, tag, body; abducti* or /re/i">
    <select id="labels">
      <option value="key">labels: key papers</option>
      <option value="all">labels: as many as fit</option>
      <option value="none">labels: none</option>
    </select>
    <select id="yaxis">
      <option value="cited">y: cited by</option>
      <option value="cites">y: cites</option>
      <option value="parents">y: cites (parents)</option>
      <option value="children">y: cites (nested)</option>
      <option value="bonus">y: cites (bonus)</option>
      <option value="citations">y: citation count</option>
      <option value="quality">y: aggregated quality</option>
    </select>
    <label class="check" id="addcited-wrap" hidden
           title="Add the in-list cited-by count on top of the selected cites axis">
      <input type="checkbox" id="addcited"> + cited
    </label>
    <label class="check"><input type="checkbox" id="edges" checked> citation links</label>
    <label class="check" title="Llama 3, OLMo 2, Spurious Rewards, Spurious Rewards Paradox, LiveMathematicianBench"><input type="checkbox" id="citefilter"> cites LLaMA / OLMo / Spurious Rewards / LiveMath</label>
    <label class="check" title="Papers that have a Telegram badge on the list"><input type="checkbox" id="tgfilter"> telegram</label>
    <label class="check" title="Override topic colours with aggregated quality (−1 red, +1 green)">
      <input type="checkbox" id="qcolor"> color by quality
      <span class="qscale" aria-hidden="true">−1<b></b>+1</span>
    </label>
    <button id="reset">reset view</button>
    <button id="share" title="Copy a link that opens the map with the selected papers" disabled>copy link</button>
  </div>
  <div class="key">
    <span><i class="i-out"></i>cites (held paper &rarr; older work)</span>
    <span><i class="i-in"></i>cited by (newer work &rarr; held paper)</span>
    <span>click to hold &middot; shift-click to add &middot; double-click to open</span>
  </div>
  <div id="legend" class="legend"></div>
</header>
<div id="tip"></div>
<div id="ghost" aria-hidden="true">
  <svg viewBox="0 0 26 30" fill="#fff" stroke="var(--ink)" stroke-width="1.4"
       stroke-linejoin="round" stroke-linecap="round">

             L20 29

             L22.6 15.5
             L18.4 8.5
             C17.6 5.2 13.6 4.4 12.2 7.6
             L11 13
             L8.6 5
             C7.8 2.4 4.6 1 3 2 Z"/>
  </svg>
</div>
<svg id="map"></svg>
<footer id="note"></footer>
<script src="../assets/vendor/d3.v7.min.js"></script>
<script src="../assets/graph_data.js"></script>
<script src="map.js"></script>
</body>
</html>
