# Synthetic full-size diagnostic only. CI supplies name, token, expiry and manifest hash.
name = "key-papers-static-probe"
main = "src/full-geometry-do-probe-entry.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../agent_geometry_probe"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SEARCH_PROBE"
class_name = "StaticSearchProbe"

[exports.StaticSearchProbe]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[build]
command = "npm run build:probe"
